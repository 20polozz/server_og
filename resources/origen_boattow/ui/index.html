/* ══ Los tokens mecanicos de la interfaz ═════════════════════════════
   Son identicos en todo el servidor. La referencia es
   origen_inventory/source-ui/src/assets/styles/arcade.css.

     --arc-vf  factor de los velos BLANCOS. Toda capa blanca esta escrita como
               rgba(255,255,255, calc(a * var(--arc-vf))). Vale 1.

     --arc-t-* los tres canales de un tinte, para escribir cada regla con su
               propio alfa.
   ═════════════════════════════════════════════════════════════════════ */
:root {
    --arc-vf: 1;
    --arc-t-hueco: 38, 34, 26;
    --arc-t-linea: 111, 104, 87;
    --arc-t-relieve: 120, 110, 88;
    --arc-t-papel1: 255, 253, 247;
    --arc-t-papel2: 246, 241, 230;
    --arc-t-papel3: 238, 231, 217;
    --arc-t-elegido: 255, 215, 228;
    --arc-papel1: #e6e7ea;
    --arc-papel2: #dcdde0;
    /* El canto de abajo de lo rosa (una sombra) y la tinta de un rotulo de
       acento. Aquí son el mismo granate. */
    --arc-accent-texto: #b3123f;
    --ogn-acc-texto: #b3123f;
}

        * { margin: 0; padding: 0; box-sizing: border-box; accent-color: #d81b55; }

        :root {
            /* Paleta del estilo claro «HUD Arcade». Los nombres --ogn-* de
               antes se conservan apuntando a los nuevos para no reescribir
               media hoja.

               Dos avisos:
               - --ogn-r no estaba declarado en ningun sitio, asi que el radio
                 del panel caia a 0 y la esquina salia en pico. Aqui ya existe.
               - Nada de backdrop-filter: en el CEF de FiveM pinta una banda
                 negra donde deberia difuminar. El cristal es opacidad. */
            /* Pegatina: el rosa de la casa (la marca lo pasa a naranja en Nación). */
            --arc-accent:      #d81b55;
            --arc-accent-deep: #b3123f;
            --arc-grad:        linear-gradient(#d81b55, #d81b55);
            --arc-ink:         #0b0b0d;
            --arc-ink-2:       #3b352a;
            --arc-ink-3:       #6b6352;
            --arc-ink-4:       #6f6857;
            --arc-glass:       #c4c6ca;
            --arc-skew:        skewX(-10deg);
            --arc-unskew:      skewX(10deg);
            --arc-cond:        'Barlow Condensed', 'Arial Narrow', sans-serif;
            --arc-text:        'Barlow', 'Segoe UI', sans-serif;
            --arc-mono:        "Oxanium", "Barlow Condensed", sans-serif;

            /* Los nombres viejos, apuntando a los nuevos. */
            --ogn-rotulo:  var(--arc-cond);
            --ogn-texto:   var(--arc-text);
            --ogn-acc:     #d81b55;
            --ogn-acc-rgb: 216, 27, 85;
            --ogn-fg:      var(--arc-ink);
            --ogn-line:    rgba(111, 104, 87, 0.24);
            --ogn-t1:      var(--arc-ink);
            --ogn-t2:      var(--arc-ink-2);
            --ogn-t3:      var(--arc-ink-4);
            --ogn-r:       14px;

            --primary-color: rgba(255, 255, 255, 0.6);
            --color-acent:   rgba(111, 104, 87, 0.24);
            --text-white:    #ffffff;
            --cubic:         cubic-bezier(0, .53, .11, .995);
            --bg-dark:       rgba(20, 17, 12, 0.5);
            --bg-panel:      rgba(255, 253, 247, 0.95);
            --border-color:  rgba(111, 104, 87, 0.28);
            --border-subtle: rgba(111, 104, 87, 0.16);
            --font-title:    var(--arc-cond);
            --font-body:     var(--arc-text);
        }

        html, body {
            width: calc(100vw / var(--ogn-escala, 1));
            height: calc(100vh / var(--ogn-escala, 1));
            background: transparent;
            overflow: hidden;
            font-family: var(--font-body);
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 0 0 calc(25vh / var(--ogn-escala, 1)) calc(2.5vh / var(--ogn-escala, 1));
            pointer-events: none;
        }

        .winch-panel {
            display: none;
            flex-direction: column;
            gap: calc(0.8vh / var(--ogn-escala, 1));
            pointer-events: all;
            animation: fadeIn 0.4s var(--cubic) backwards;
        }

        .winch-panel.visible {
            display: flex;
        }

        /* ══ El panel ══════════════════════════════════════════════
           La hoja de papel del estilo claro: crema con el filo rosa de 4 px
           arriba, radio 14 y una sombra larga.

           NADA de `overflow: hidden` aqui dentro: las chapas van sesgadas y
           llevan la sombra de 5 px por debajo, y un recorte se las come. */
        .panel {
            background: var(--arc-glass);
            border: 0;
            border-top: 4px solid var(--arc-accent);
            border-radius: var(--ogn-r);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            padding: calc(1.5vh / var(--ogn-escala, 1)) calc(1.8vh / var(--ogn-escala, 1)) calc(1.8vh / var(--ogn-escala, 1));
            min-width: calc(27vh / var(--ogn-escala, 1));
        }

        /* ── Cabecera: sello rosa inclinado + rotulo en cursiva ─────
           La raya de debajo es la del estilo: arranca en rosa y se apaga. */
        .panel-header {
            display: flex;
            align-items: center;
            gap: calc(1vh / var(--ogn-escala, 1));
            margin-bottom: calc(1.3vh / var(--ogn-escala, 1));
            padding-bottom: calc(1vh / var(--ogn-escala, 1));
            border: 0;
            background:
                linear-gradient(90deg, var(--arc-accent) 0%, rgba(255, 255, 255, calc(0.7 * var(--arc-vf))) 20%, transparent 100%)
                bottom left / 100% 2px no-repeat;
        }

        /* El sesgo va en un `::before` por detras: asi el ancla se queda
           derecha sin tener que envolverla en un <span>. */
        .panel-icon {
            position: relative;
            isolation: isolate;
            width: calc(3.4vh / var(--ogn-escala, 1));
            height: calc(3.4vh / var(--ogn-escala, 1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(1.7vh / var(--ogn-escala, 1));
            color: #ffffff;
            flex-shrink: 0;
        }

        .panel-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            transform: var(--arc-skew);
            border-radius: 8px;
            background: var(--arc-grad);
            box-shadow: 0 4px 0 var(--arc-accent-deep);
        }

        .panel-title {
            font-family: var(--arc-cond);
            font-style: italic;
            font-weight: 800;
            font-size: calc(1.95vh / var(--ogn-escala, 1));
            line-height: 1.05;
            color: var(--arc-ink);
            letter-spacing: 0;
            text-transform: uppercase;
        }

        /* ── La cifra: rotulo arriba, numero en monoespaciada abajo ── */
        .length-chip {
            display: flex;
            flex-direction: column;
            gap: calc(0.35vh / var(--ogn-escala, 1));
            padding: calc(0.9vh / var(--ogn-escala, 1)) calc(1.1vh / var(--ogn-escala, 1)) calc(1vh / var(--ogn-escala, 1));
            border: 0;
            border-radius: 9px;
            background: rgba(var(--arc-t-linea), 0.12);
            box-shadow: inset 0 0 0 1px rgba(var(--arc-t-linea), 0.22);
            margin-bottom: calc(1.3vh / var(--ogn-escala, 1));
        }

        .chip-label {
            font-size: calc(1.05vh / var(--ogn-escala, 1));
            font-family: var(--arc-cond);
            font-weight: 700;
            color: var(--arc-ink-4);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .chip-value {
            font-size: calc(1.9vh / var(--ogn-escala, 1));
            font-family: var(--arc-mono);
            font-weight: 400;
            color: var(--arc-ink);
            letter-spacing: 0;
            font-variant-numeric: tabular-nums;
        }

        /* Barra visual de longitud. El recorte aqui si vale: no hay nada
           sesgado dentro, solo el relleno. */
        .rope-bar-wrap {
            width: 100%;
            height: calc(0.55vh / var(--ogn-escala, 1));
            background: rgba(var(--arc-t-linea), 0.24);
            border-radius: 4px;
            overflow: hidden;
            margin-top: calc(0.45vh / var(--ogn-escala, 1));
        }

        .rope-bar-fill {
            height: 100%;
            background: var(--arc-grad);
            border-radius: 4px;
            transition: width 0.25s var(--cubic);
        }

        /* ══ Botones ═══════════════════════════════════════════════
           El hueco de calc(1.1vh / var(--ogn-escala, 1)) no es decoracion: la chapa va sesgada diez grados
           y sobresale de su casilla por los dos costados. Con menos, se pisan
           entre ellas y con el canto del panel. */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: calc(1.1vh / var(--ogn-escala, 1));
        }

        .btn {
            position: relative;
            isolation: isolate;
            padding: calc(1vh / var(--ogn-escala, 1)) calc(0.8vh / var(--ogn-escala, 1));
            border: 0;
            border-radius: 0;
            background: none;
            color: var(--arc-ink-2);
            font-size: calc(1.2vh / var(--ogn-escala, 1));
            font-family: var(--arc-cond);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: calc(0.5vh / var(--ogn-escala, 1));
            transition: color 0.2s ease;
            user-select: none;
        }

        /* El relieve: filete claro por dentro y 5 px de canto debajo. */
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            transform: var(--arc-skew);
            border-radius: 7px;
            background: rgba(255, 255, 255, calc(0.72 * var(--arc-vf)));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, calc(0.95 * var(--arc-vf))),
                        0 5px 0 rgba(var(--arc-t-relieve), 0.45);
            transition: background 0.2s ease, box-shadow 0.12s ease;
        }

        /* Al pulsar, la chapa se hunde: el canto baja de 5 a 2 px y la pieza
           acompaña. */
        .btn:active { transform: translateY(3px); }
        .btn:active::before { box-shadow: inset 0 1px 0 rgba(255, 255, 255, calc(0.95 * var(--arc-vf))),
                                          0 2px 0 rgba(var(--arc-t-relieve), 0.45); }

        .btn-primary:hover::before { background: rgba(255, 255, 255, calc(0.92 * var(--arc-vf))); }
        .btn-primary:hover { color: var(--arc-ink); }

        /* Cortar la cuerda es lo que no tiene vuelta: es el unico rosa de la
           pantalla. */
        .btn-danger { color: #ffffff; }

        .btn-danger::before {
            background: var(--arc-grad);
            box-shadow: 0 5px 0 var(--arc-accent-deep);
        }

        .btn-danger:active::before { box-shadow: 0 2px 0 var(--arc-accent-deep); }

        .btn-danger:hover { color: #ffffff; }

        .btn-full {
            grid-column: span 2;
            margin-top: calc(0.2vh / var(--ogn-escala, 1));
        }

        /* Animación */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(calc(2vh / var(--ogn-escala, 1))); }
            to   { opacity: 1; transform: translateY(0); }
        }

/* ══ PEGATINA: el panel del cabrestante con el estilo del logo ═════════

   Entra siempre (selectores html #app), en Origen y en Nación; lo de
   arriba es la capa vieja y queda pisada. Mismas reglas y colores que
   origen_inventory/source-ui/src/assets/styles/pegatina.css.

   Papel blanco, canto negro grueso, sombra dura, rosa con tinta
   negra para lo que no tiene vuelta, nada inclinado.

   Los cantos son box-shadow, no border: no cambia ninguna medida.
   Para quitarlo: borrar este bloque y las dos familias (Knewave, Oxanium)
   del <link> de arriba.
   ════════════════════════════════════════════════════════════════════ */

/* ── Tokens ─────────────────────────────────────────────────────────── */
html #app {
    --arc-vf: 1;
    --arc-t-hueco: 11, 11, 13;
    --arc-t-linea: 11, 11, 13;
    --arc-t-relieve: 0, 0, 0;
    --arc-accent: #d81b55;
    --arc-accent-deep: #000;
    --arc-accent-texto: #b3123f;
    --arc-grad: linear-gradient(#d81b55, #d81b55);
    --arc-ink: #0b0b0d;
    --arc-ink-2: #0b0b0d;
    --arc-ink-3: #44444a;
    --arc-ink-4: #55555c;
    --arc-glass: #c4c6ca;
    /* Nada inclinado: las chapas van rectas. */
    --arc-skew: skewX(0deg);
    --arc-unskew: skewX(0deg);
}

/* ── El panel ───────────────────────────────────────────────────────── */
html #app .panel {
    background: #c4c6ca;
    border-top-color: #c4c6ca;
    border-radius: 20px;
    box-shadow: 0 0 0 1.5px #000, 3px 3px 0 1.5px #000;
    color: #0b0b0d;
}

           Se engancha a play() y a las conexiones de Web Audio antes de que

    <div id="app">

                        ▲ Recoger
                    </button>
                    <button class="btn btn-primary" id="btnSoltar" onmousedown="startAction('soltar')" onmouseup="stopAction()" onmouseleave="stopAction()">
                        ▼ Soltar
                    </button>

                        ✂ Cortar Cuerda
                    </button>

                <span class="bt-riel__marca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg></span>
                <span class="bt-riel__pie" id="rielPie">Origen Grúa</span>

    <script>
        // El nombre del riel según la marca (<html data-marca>, que pone el
        // trozo de marca y avisa con origen:marca:puesta).
        (function () {
            var pie = document.getElementById('rielPie');
            var poner = function () {
                pie.textContent = (document.documentElement.dataset.marca === 'nacion' ? 'Nación' : 'Origen') + ' Grúa';
            };
            poner();
            window.addEventListener('message', function (e) {
                if (e.data && e.data.accion === 'origen:marca:puesta') poner();
            });
        })();

        const MAX_ROPE = 100.0;
        let actionInterval = null;

        function updateUI(length) {
            const pct = Math.min(100, Math.max(0, (length / MAX_ROPE) * 100));
            document.getElementById('ropeLength').textContent = length.toFixed(1).replace('.', ',') + ' m';
            document.getElementById('ropeBar').style.width = pct + '%';
        }

        function sendAction(action) {
            fetch(`https://origen_boattow/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
        }

        function startAction(action) {
            sendAction(action);
            actionInterval = setInterval(() => sendAction(action), 120);
        }

        function stopAction() {
            if (actionInterval) {
                clearInterval(actionInterval);
                actionInterval = null;
                sendAction('stopWinch');
            }
        }

        window.addEventListener('message', function(event) {
            const data = event.data;

            if (data.type === 'showWinch') {
                document.getElementById('winchPanel').classList.add('visible');
                updateUI(data.length);
            }

            if (data.type === 'hideWinch') {
                document.getElementById('winchPanel').classList.remove('visible');
            }

            if (data.type === 'updateLength') {
                updateUI(data.length);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'h' || e.key === 'H' || e.key === 'Escape') {
                sendAction('closeUI');
            }
        });
    </script>
