<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Trama diagonal muy fina: textura sin dibujo. -->
    <pattern id="p" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="10" height="10" fill="#0a0a0d" />
      <rect width="10" height="1" fill="#ffffff" opacity="0.045" />
    </pattern>
  </defs>
  <rect width="600" height="1200" fill="#07060a" />
  <rect width="600" height="1200" fill="url(#p)" />
</svg>
