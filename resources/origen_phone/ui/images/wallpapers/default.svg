<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Negro casi puro con un foco de color muy bajo.

         Estaba al 30 %, y eso es media pantalla de rosa: el acento no decora,
         y con el fondo tenido de marca cualquier cosa que si lleve acento
         —lo elegido, lo encendido— deja de distinguirse. Al 8 % da profundidad
         y no compite con nada. Ver .claude/skills/origen-tablet/SKILL.md -->
    <radialGradient id="a" cx="18%" cy="12%" r="85%">
      <stop offset="0%" stop-color="#17131c" />
      <stop offset="55%" stop-color="#0c0a10" />
      <stop offset="100%" stop-color="#07060a" />
    </radialGradient>
    <radialGradient id="b" cx="88%" cy="78%" r="70%">
      <stop offset="0%" stop-color="#fc0259" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#fc0259" stop-opacity="0" />
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="600" height="1200" fill="url(#a)" />
  <rect width="600" height="1200" fill="url(#b)" />
  <!-- Grano muy tenue para que el negro no quede plano. -->
  <rect width="600" height="1200" filter="url(#grain)" opacity="0.05" />
</svg>
