<!-- ORIGEN · vigilante del raton. NO EDITAR A MANO: este trozo es identico
         en todas las interfaces del servidor y lo reparte
         kit/repartir-foco.py. El lado de Lua es @origen_map/shared/foco.lua:
         mientras el recurso tiene el raton, pregunta cada 1,5 s si esta
         pagina enseña algo, y si dos veces seguidas no, suelta el raton.
         Ante la duda contesta que SI: soltar el raton de una pantalla que se
         ve es peor que tardar en soltarlo. -->
    <script>
      (function () {
        // El fetch del navegador, guardado antes de que la pagina cargue lo
        // suyo: alguna (origen_titlemenu) declara un `fetch` global propio.
        var enviar = window.fetch.bind(window)
        var TOPE = 6000
        var HUECO = /^(transparent|rgba\([^)]*,\s*0(\.0+)?\))$/
        var SIEMPRE = { IMG: 1, VIDEO: 1, CANVAS: 1, IFRAME: 1, INPUT: 1, TEXTAREA: 1, SELECT: 1, BUTTON: 1, svg: 1, SVG: 1 }
        var color = function (c) { return c && !HUECO.test(c) }
        var borde = function (cs) {
          return (parseFloat(cs.borderTopWidth) > 0 && color(cs.borderTopColor)) ||
            (parseFloat(cs.borderBottomWidth) > 0 && color(cs.borderBottomColor)) ||
            (parseFloat(cs.borderLeftWidth) > 0 && color(cs.borderLeftColor)) ||
            (parseFloat(cs.borderRightWidth) > 0 && color(cs.borderRightColor))
        }
        var capa = function (cs) {
          return color(cs.backgroundColor) || cs.backgroundImage !== 'none' ||
            cs.boxShadow !== 'none' || borde(cs)
        }
        var pseudo = function (el, cual) {
          var ps = getComputedStyle(el, cual)
          var c = ps.content
          if (!c || c === 'none' || c === 'normal') return false
          return capa(ps) || (c.length > 2 && color(ps.color))
        }
        var pinta = function (el, cs) {
          if (SIEMPRE[el.tagName]) return true
          if (capa(cs)) return true
          if (color(cs.color) && parseFloat(cs.fontSize) > 0) {
            for (var h = el.firstChild; h; h = h.nextSibling) {
              if (h.nodeType === 3 && h.nodeValue.trim()) return true
            }
          }
          return pseudo(el, '::before') || pseudo(el, '::after')
        }
        var hayAlgo = function () {
          if (!document.body) return true
          var W = window.innerWidth
          var H = window.innerHeight
          var paseo = document.createTreeWalker(document.body, 1, {
            acceptNode: function (el) {
              var cs = getComputedStyle(el)
              // Lo que no se ve no deja ver a sus hijos: se salta la rama.
              if (cs.display === 'none' || parseFloat(cs.opacity) < 0.02) return 2
              // Ni lo marcado como HUD fijo (sin raton): no es una pantalla
              // abierta, y si contara la red no soltaria nunca.
              if (el.hasAttribute('data-foco-ignora')) return 2
              return 1
            }
          })
          var n = 0
          var el
          while ((el = paseo.nextNode())) {
            if (++n > TOPE) return true
            var cs = getComputedStyle(el)
            if (cs.visibility !== 'visible') continue
            var r = el.getBoundingClientRect()
            if (r.width < 2 || r.height < 2) continue
            if (r.right <= 0 || r.bottom <= 0 || r.left >= W || r.top >= H) continue
            if (pinta(el, cs)) return true
          }
          return false
        }
        window.addEventListener('message', function (e) {
          var d = e.data
          if (!d || d.accion !== 'origen:foco:mira') return
          var visto = true
          // Una pagina con HUD fijo (siempre pinta algo) dice ella misma si
          // hay una pantalla CON RATON delante: window.__origenFocoVisto.
          try {
            visto = typeof window.__origenFocoVisto === 'function'
              ? window.__origenFocoVisto() !== false
              : hayAlgo()
          } catch (err) { visto = true }
          try {
            var yo = typeof GetParentResourceName === 'function' ? GetParentResourceName() : null
            if (!yo) return
            enviar('https://' + yo + '/origen:foco:veo', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=UTF-8' },
              body: JSON.stringify({ n: d.n, visto: visto })
            }).catch(function () {})
          } catch (err) {}
        })
        window.__origenFocoHayAlgo = hayAlgo
      })()
    </script>

         En origen no hace nada. -->
    <script>
      (function () {
        var PALETAS = {
          /* tono: el de la marca nueva, en grados.
             luz:  por donde pasa la escala, [luz del rosa, luz nueva]. El naranja
                   es mas claro que el rosa a igual papel: el de los botones sube,
                   y el de LEER sobre crema se queda oscuro para que se lea.
             fijos: los que tienen que salir clavados, pedidos por el usuario:
                   acc #FD8A23 · soft #FFAA5C · pale #FFD9B6 · deep #6A3402 */

            tono: 28.5,
            sat: 1.04,
            luz: [[0, 0], [0.267, 0.212], [0.396, 0.36], [0.453, 0.565], [0.714, 0.68], [0.8, 0.857], [1, 1]],
            fijos: {
              e0074f: [253, 138, 35], fc0259: [253, 138, 35],
              /* el rosa menos neon (06/10) sale con el MISMO naranja que el rosa de antes */
              d81b55: [255, 146, 48], df2f63: [255, 154, 64], b3123f: [227, 108, 0],
              ff6d97: [255, 170, 92],
              fd9bbd: [255, 217, 182],
              '7d0b31': [106, 52, 2], '82173c': [106, 52, 2]
            }
          }
        }

        var memo = {}

        var hex2 = function (n) { return (n < 16 ? '0' : '') + n.toString(16) }

        /* -> [r, g, b] de la marca nueva, o null si el color no es de la familia. */
        var cambiar = function (r, g, b) {
          var k = (r << 16) | (g << 8) | b
          if (k in memo) return memo[k]

          var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn
          if (d > 0) {
            var l = (mx + mn) / 510
            var s = d / (255 - Math.abs(mx + mn - 255))
            var h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4

                for (var i = 1; i < c.length; i++) {

                var C = (1 - Math.abs(2 * L - 1)) * S

                var X = C * (1 - Math.abs(H % 2 - 1))
                var m = L - C / 2
                var t = H < 1 ? [C, X, 0] : H < 2 ? [X, C, 0] : H < 3 ? [0, C, X] : H < 4 ? [0, X, C] : H < 5 ? [X, 0, C] : [C, 0, X]

           como %23 dentro de un data:), rgb()/rgba() y los tres canales sueltos de
           un token (`--acc-rgb: 224, 7, 79`). */

           texto y se sustituye entera por un <style> en su mismo sitio.

           del juego, escribir en una regla de la hoja del movil (Tailwind v4)
           --`regla.style.cssText = ...` o un solo `setProperty`-- deja el navegador

                  Iba debajo de «km/h», y ese segundo piso descentraba la
                  velocidad: el número se alineaba con la fila de arriba y
                  quedaba más alto que bajo. Aquí hace pareja con los testigos
                  y el piso del coche se queda con una sola línea de lectura.  -->
            <div class="cuentakm" id="cuentakm" hidden><i class="cuentakm__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.2 3h2l-.6 5h2.8l-.6-5h2l3.6 18h-5l-.5-4.5h-1.8L10.6 21h-5z"/></svg></i><span id="km"></span></div>
            <div class="destinokm" id="destinokm" hidden>
                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path d="M10 2C6.69 2 4 4.69 4 8c0 4.5 6 10 6 10s6-5.5 6-10c0-3.31-2.69-6-6-6zm0 8.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <span id="destinokmTxt">--</span>
            </div>

            <div class="testigos" id="testigos" hidden>
                <span class="testigo" id="tCinturon" title="Cinturón">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                        <rect x="1.2" y="5.6" width="6.4" height="4.8" rx="1"/>
                        <rect x="7.6" y="3.4" width="7.2" height="9.2" rx="2"/>
                        <path d="M11.2 6.4 V9.6"/>
                    </svg>
                </span>
                <span class="testigo" id="tLuces" title="Luces">
                    <svg viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path class="testigo__faro" d="M8.5 2.2 H5.6 A4.6 4.6 0 0 0 5.6 12.8 H8.5 Z" stroke="none"/>
                        <path d="M8.5 2.2 H5.6 A4.6 4.6 0 0 0 5.6 12.8 H8.5 Z"/>
                        <path d="M11.6 4.6 H15.4"/><path d="M11.6 7.5 H16.6"/><path d="M11.6 10.4 H15.4"/>
                    </svg>
                </span>
            </div>
            <div class="sobre" id="sobre" hidden>
                <i class="calle__pin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2z"/></svg></i>
                <span class="sobre__calle" id="sobreCalle"></span>
                <span class="sobre__zona" id="sobreZona"></span>
                <span class="sobre__dist" id="sobreDist" hidden></span>
                <i class="calle__mas" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></i>
            </div>

            <!-- La razon de ser del prototipo. -->
            <div class="medida" id="medida" hidden>
                <span class="medida__d"><b id="fpsNui">--</b><i>nui</i></span>
                <span class="medida__d"><b id="fpsJuego">--</b><i>juego</i></span>
                <span class="medida__d"><b id="ruta">--</b><i>ruta</i></span>
            </div>
        </div>

        <!--  La calle y la zona. Siempre puesta, aunque todavia no haya calle:
              es un piso del marco, y si se escondiera el mapa daria un salto. -->
        <!--  El piso de abajo: la calle a pie, el coche montado. Van dentro de
              una misma pieza para que al cambiar de uno a otro la ALTURA se
              funda (25 u la calle, 46 u el coche) en vez de pegar un salto.  -->
        <div class="piso" id="piso">
        <!--  EN COCHE, en lugar de la calle: velocidad, con la marcha en su
              pastilla rosa encima de «km/h» (las dos juntas miden lo que el
              número), y gasolina y estado del coche en celdas. El
              cuentakilómetros va arriba, en la esquina del mapa. El nitroso es
              la tira fina de abajo del todo, y solo sale si el coche lleva
              botella.  -->
        <div class="conduccion" id="conduccion" hidden>
            <!--  El papel de la tarjeta en la forma REDONDA (media luna, 14/09):
                  el canto de arriba es un arco concentrico con el mapa, 5,5 u
                  por fuera del bisel, y las alas suben a abrazarlo. Medidas en
                  u: 216 × 96, igual que la caja en estilo.css. En la cuadrada
                  no se pinta.  -->
            <svg class="conduccion__papel" viewBox="-108 0 216 96" aria-hidden="true">
                <path d="M -78 0 A 136 136 0 0 0 78 0 C 87.8 -6.9 108 6 108 28 V 84 Q 108 96 96 96 H -96 Q -108 96 -108 84 V 28 C -108 6 -87.8 -6.9 -78 0 Z"/>
            </svg>
            <div class="vel">
                <span class="vel__n" id="vel">0</span>
                <span class="vel__lado">
                    <span class="marcha" id="marcha"><span>N</span></span>
                    <span class="vel__u">km/h</span>
                </span>
            </div>
            <div class="medidores">
                <div class="medidor" id="mGas">
                    <span class="medidor__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12"/><path d="M4 10h10"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg></span>
                    <span class="medidor__k">Gas</span>
                    <span class="medidor__celdas"></span>
                    <span class="medidor__v">0%</span>
                </div>
                <!--  Motor y carrocería por separado. Con un solo «Coche»
                      (que era la carrocería) el motor se rompía marcando 80 %.  -->
                <div class="medidor medidor--coche" id="mMotor">
                    <span class="medidor__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h7l2 3h2v-2h2v8h-2v-2h-2l-2 3H8l-2-2H4v-4h2z"/><path d="M9 5h4"/><path d="M11 5v3"/></svg></span>
                    <span class="medidor__k">Motor</span>
                    <span class="medidor__celdas"></span>
                    <span class="medidor__v">100%</span>
                </div>
                <div class="medidor medidor--coche" id="mCoche">
                    <span class="medidor__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v-3l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3.5 12h17"/><circle cx="7" cy="17" r="1.8"/><circle cx="17" cy="17" r="1.8"/></svg></span>
                    <span class="medidor__k">Chapa</span>
                    <span class="medidor__celdas"></span>
                    <span class="medidor__v">100%</span>
                </div>
            </div>
        </div>
        </div>
        <div class="nos" id="nos" hidden></div>
    </div>

    <!-- ══ Comida y agua ══════════════════════════════════════════════
         Una linea abajo a la izquierda, debajo del minimapa y de su mismo
         ancho: comida a la izquierda, agua a la derecha. El minimapa sube lo
         que ella mide (--nec-sube, en mapa.js). Mismo papel, letra y celdas
         que los medidores del coche. -->
    <div class="necesidades" id="alertasNecesidades" data-v="barra" aria-hidden="true" hidden>
        <div class="nec" id="alertaComida">
            <span class="nec__ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 11h16a1 1 0 0 0 1-1A7 7 0 0 0 3 10a1 1 0 0 0 1 1z" />
                    <path d="M3.5 14.5h17" />
                    <path d="M5 18.5h14a2 2 0 0 0 2-2H3a2 2 0 0 0 2 2z" />
                </svg>
            </span>
            <span class="nec__k">Comida</span>
            <span class="nec__celdas"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="nec__v" id="alertaComidaVal">100%</span>
        </div>
        <!-- El micro, entre la comida y el agua (04/10, solo Origen: en Nacion
             esta pieza no se pinta y el micro sigue en el HUD). Rosa mientras
             hablas; las tres ondas son el alcance: sin ondas, susurro; una, normal; dos, grito (susurro, normal, grito).
             Lo alimenta client/main.lua con la accion «voz». -->
        <div class="nec-voz" id="necVoz" data-nivel="2" aria-hidden="true">
            <svg viewBox="0 0 32 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <!-- El micro, siempre. -->
                <rect x="13" y="2.5" width="6" height="11" rx="3" />
                <path d="M9.5 10.5a6.5 6.5 0 0 0 13 0M16 17v4" />
                <!-- Normal: una onda a cada lado. -->
                <path class="o1" d="M6.2 7.2a5 5 0 0 0 0 6M25.8 7.2a5 5 0 0 1 0 6" />
                <!-- Grito: la segunda onda. -->
                <path class="o2" d="M2.6 4.6a9 9 0 0 0 0 11.2M29.4 4.6a9 9 0 0 1 0 11.2" />
            </svg>
        </div>
        <div class="nec" id="alertaAgua">
            <span class="nec__ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3.2l5.2 5.4a7.4 7.4 0 1 1-10.4 0z" />
                </svg>
            </span>
            <span class="nec__k">Agua</span>
            <span class="nec__celdas"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="nec__v" id="alertaAguaVal">100%</span>
        </div>
    </div>

    <script src="mapa.js?v=53"></script>
</body>
</html>
