    <style>
        /*
            ORIGEN TELEPORTS · lo suyo

            Las zonas, los botones, las pastillas, los campos, el interruptor y
            los cuadros los pinta ogn.css. Aquí queda la ficha de un pasaje y la
            fila de un punto, que son de este recurso y de ningún otro.
        */

        .tp-cab { display: flex; align-items: center; gap: calc(0.9vh / var(--ogn-escala, 1)); }

        /* La caja que rueda va aparte de la rejilla: pegada al canto de la
           zona, el redondeo de la zona no se ve. */
        .tp-caja {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: calc(1.2vh / var(--ogn-escala, 1));
        }

        .tp-rejilla { grid-template-columns: repeat(auto-fill, minmax(calc(32vh / var(--ogn-escala, 1)), 1fr)); }

        /* ── La ficha de un pasaje ─────────────────────────────────────── */
        .tp-pasaje {
            display: flex;
            flex-direction: column;
            gap: calc(1.1vh / var(--ogn-escala, 1));
            padding: calc(1.4vh / var(--ogn-escala, 1));
            border: 1px solid var(--ogn-line-soft);
            border-radius: var(--ogn-r);
            /* Resto del tema negro: un velo de blanco al 2,5 % sobre el crema
               no se ve. La superficie del tema es tinta parda al 5 %. */
            background: var(--ogn-surface);
        }

        /* Apagado: sigue en la lista porque se puede volver a encender, pero
           no compite con los que están funcionando. */
        .tp-pasaje--off { opacity: 0.5; }

        .tp-pasaje__cab {
            display: flex;
            align-items: center;
            gap: calc(1vh / var(--ogn-escala, 1));
            min-width: 0;
        }

        /* El nombre se pulsa para cambiarlo, así que es un botón: si fuera
           texto suelto nadie descubriría que se puede tocar. */
        .tp-pasaje__n {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: calc(0.7vh / var(--ogn-escala, 1));
            background: none;
            border: 0;
            text-align: left;
            font-family: var(--ogn-rotulo);
            font-weight: 700;
            font-size: calc(1.05vh / var(--ogn-escala, 1));
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ogn-fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.2s ease;
        }

        .tp-pasaje__n:hover { color: var(--ogn-acc-soft); }
        .tp-pasaje__n iconify-icon { flex: none; color: var(--ogn-t4); font-size: calc(1.2vh / var(--ogn-escala, 1)); }
        .tp-pasaje__n:hover iconify-icon { color: var(--ogn-acc-soft); }

        /* ── Un punto del pasaje ───────────────────────────────────────── */
        .tp-puntos { display: flex; flex-direction: column; gap: calc(0.4vh / var(--ogn-escala, 1)); }

        .tp-punto {
            display: flex;
            align-items: center;
            gap: calc(0.9vh / var(--ogn-escala, 1));
            padding: calc(0.7vh / var(--ogn-escala, 1)) calc(1vh / var(--ogn-escala, 1));
            border: 1px solid transparent;
            border-radius: var(--ogn-r);
            background: var(--ogn-sunken);
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease;
        }

        .tp-punto:hover {
            border-color: rgba(var(--ogn-acc-rgb), 0.35);
            background: rgba(var(--ogn-acc-rgb), 0.08);
        }

        .tp-punto__i { flex: none; color: var(--ogn-t4); font-size: calc(1.2vh / var(--ogn-escala, 1)); }

        .tp-punto__n {
            flex: 1;
            min-width: 0;
            font-family: var(--ogn-texto);
            font-size: calc(1.15vh / var(--ogn-escala, 1));
            color: var(--ogn-t1);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Las coordenadas se comparan cifra a cifra. */
        .tp-punto__c {
            flex: none;
            font-family: var(--ogn-mono);
            font-size: calc(0.95vh / var(--ogn-escala, 1));
            color: var(--ogn-t4);
            font-variant-numeric: tabular-nums;
        }

        .tp-punto__x {
            flex: none;
            display: grid;
            place-items: center;
            width: calc(2.2vh / var(--ogn-escala, 1));
            height: calc(2.2vh / var(--ogn-escala, 1));
            border: 1px solid transparent;
            border-radius: var(--ogn-r-ctrl);
            background: none;
            color: var(--ogn-t4);
            font-size: calc(1.1vh / var(--ogn-escala, 1));
            transition: color 0.18s ease, border-color 0.18s ease;
        }

        .tp-punto__x:hover { color: var(--ogn-bad); border-color: rgba(255, 77, 94, 0.4); }

        .tp-sinpuntos {
            padding: calc(1.4vh / var(--ogn-escala, 1));
            text-align: center;
            font-family: var(--ogn-rotulo);
            font-size: calc(0.85vh / var(--ogn-escala, 1));
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ogn-t4);
        }

        .tp-pasaje__pie {
            display: flex;
            gap: calc(0.6vh / var(--ogn-escala, 1));
            padding-top: calc(1.1vh / var(--ogn-escala, 1));
            border-top: 1px solid var(--ogn-line-soft);
        }

        .tp-pasaje__pie .ogn-btn { flex: 1; }

        /* ── Dentro de los cuadros ─────────────────────────────────────── */
        .tp-form { display: flex; flex-direction: column; gap: calc(1.8vh / var(--ogn-escala, 1)); }

        .tp-grupo {
            display: flex;
            flex-direction: column;
            gap: calc(1.6vh / var(--ogn-escala, 1));
            padding-bottom: calc(1.8vh / var(--ogn-escala, 1));
            border-bottom: 1px solid var(--ogn-line-soft);
        }

        .tp-fila { display: flex; align-items: flex-end; gap: calc(1.1vh / var(--ogn-escala, 1)); }
        .tp-fila .ogn-field { flex: 1; }

        /* Un campo mal se marca con la línea en rojo y una frase debajo: el
           rojo aquí es un estado real, no decoración. */
        .tp-mal .ogn-field__input { border-bottom-color: var(--ogn-bad); }

        .tp-pista {
            font-family: var(--ogn-texto);
            font-size: calc(1.05vh / var(--ogn-escala, 1));
            color: var(--ogn-t4);
        }

        .tp-mal .tp-pista { color: var(--ogn-bad); }

        .tp-reglas { display: flex; flex-direction: column; }

        .tp-reglas > * + * {
            margin-top: calc(1.4vh / var(--ogn-escala, 1));
            padding-top: calc(1.4vh / var(--ogn-escala, 1));
            border-top: 1px solid var(--ogn-line-soft);
        }
    </style>

























<!-- ORIGEN · vigilante del raton. NO EDITAR A MANO: este trozo es identico
         en todas las interfaces del servidor y lo reparte
         kit/repartir-foco.py. El lado de Lua es @origen_map/shared/foco.lua:
         mientras el recurso tiene el raton, pregunta cada 1,5 s si esta
         pagina enseña algo, y si dos veces seguidas no, suelta el raton.
         Ante la duda contesta que SI: soltar el raton de una pantalla que se
         ve es peor que tardar en soltarlo. -->
    <script>
      (function () {
        // El fetch del navegador, guardado antes de que la pagina cargue lo
        // suyo: alguna (origen_titlemenu) declara un `fetch` global propio.
        var enviar = window.fetch.bind(window)
        var TOPE = 6000
        var HUECO = /^(transparent|rgba\([^)]*,\s*0(\.0+)?\))$/
        var SIEMPRE = { IMG: 1, VIDEO: 1, CANVAS: 1, IFRAME: 1, INPUT: 1, TEXTAREA: 1, SELECT: 1, BUTTON: 1, svg: 1, SVG: 1 }
        var color = function (c) { return c && !HUECO.test(c) }
        var borde = function (cs) {
          return (parseFloat(cs.borderTopWidth) > 0 && color(cs.borderTopColor)) ||
            (parseFloat(cs.borderBottomWidth) > 0 && color(cs.borderBottomColor)) ||
            (parseFloat(cs.borderLeftWidth) > 0 && color(cs.borderLeftColor)) ||
            (parseFloat(cs.borderRightWidth) > 0 && color(cs.borderRightColor))
        }
        var capa = function (cs) {
          return color(cs.backgroundColor) || cs.backgroundImage !== 'none' ||
            cs.boxShadow !== 'none' || borde(cs)
        }
        var pseudo = function (el, cual) {
          var ps = getComputedStyle(el, cual)
          var c = ps.content
          if (!c || c === 'none' || c === 'normal') return false
          return capa(ps) || (c.length > 2 && color(ps.color))
        }
        var pinta = function (el, cs) {
          if (SIEMPRE[el.tagName]) return true
          if (capa(cs)) return true
          if (color(cs.color) && parseFloat(cs.fontSize) > 0) {
            for (var h = el.firstChild; h; h = h.nextSibling) {
              if (h.nodeType === 3 && h.nodeValue.trim()) return true
            }
          }
          return pseudo(el, '::before') || pseudo(el, '::after')
        }
        var hayAlgo = function () {
          if (!document.body) return true
          var W = window.innerWidth
          var H = window.innerHeight
          var paseo = document.createTreeWalker(document.body, 1, {
            acceptNode: function (el) {
              var cs = getComputedStyle(el)
              // Lo que no se ve no deja ver a sus hijos: se salta la rama.
              if (cs.display === 'none' || parseFloat(cs.opacity) < 0.02) return 2
              // Ni lo marcado como HUD fijo (sin raton): no es una pantalla
              // abierta, y si contara la red no soltaria nunca.
              if (el.hasAttribute('data-foco-ignora')) return 2
              return 1
            }
          })
          var n = 0
          var el
          while ((el = paseo.nextNode())) {
            if (++n > TOPE) return true
            var cs = getComputedStyle(el)
            if (cs.visibility !== 'visible') continue
            var r = el.getBoundingClientRect()
            if (r.width < 2 || r.height < 2) continue
            if (r.right <= 0 || r.bottom <= 0 || r.left >= W || r.top >= H) continue
            if (pinta(el, cs)) return true
          }
          return false
        }
        window.addEventListener('message', function (e) {
          var d = e.data
          if (!d || d.accion !== 'origen:foco:mira') return
          var visto = true
          // Una pagina con HUD fijo (siempre pinta algo) dice ella misma si
          // hay una pantalla CON RATON delante: window.__origenFocoVisto.
          try {
            visto = typeof window.__origenFocoVisto === 'function'
              ? window.__origenFocoVisto() !== false
              : hayAlgo()
          } catch (err) { visto = true }
          try {
            var yo = typeof GetParentResourceName === 'function' ? GetParentResourceName() : null
            if (!yo) return
            enviar('https://' + yo + '/origen:foco:veo', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=UTF-8' },
              body: JSON.stringify({ n: d.n, visto: visto })
            }).catch(function () {})
          } catch (err) {}
        })
        window.__origenFocoHayAlgo = hayAlgo
      })()
    </script>

    <script>
      (function () {
        var PALETAS = {
          /* tono: el de la marca nueva, en grados.

  <style>/* 07/10: sin barras de desplazamiento visibles; se sigue pudiendo desplazar. */ html *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; } html * { scrollbar-width: none !important; }</style></head>

<body>
    <div id="app" class="ogn-stage" style="display: none;">
        <div class="ogn-stage__veil"></div>

        <!-- ══ Raíl ══════════════════════════════════════════════════ -->
        <nav class="ogn-rail">
            <div class="ogn-rail__top">
                <iconify-icon icon="lucide:door-open" class="ogn-rail__mark" style="font-size: calc(2.2vh / var(--ogn-escala, 1))"></iconify-icon>
                <div class="ogn-rail__nav" id="railNav"></div>
            </div>

            <div class="ogn-rail__mid">
                <span class="ogn-rail__word"><span class="solo-origen">Origen</span><span class="solo-nacion">Nación</span> Pasajes</span>
            </div>

            <div class="ogn-rail__foot" id="railStatus">
                <span class="ogn-rail__dot"></span>
                <span class="ogn-rail__state" id="railState">Sin pasajes</span>
            </div>
        </nav>

        <!-- ══ El marco ══════════════════════════════════════════════ -->
        <div class="ogn-frame">
            <header class="ogn-head">
                <span class="ogn-head__placa"><iconify-icon icon="lucide:door-open"></iconify-icon></span>
                <div class="ogn-head__title">
                    <span class="ogn-kicker">Gestión de pasajes</span>
                    <h2 class="ogn-h2" id="tituloSeccion" data-brocha="Puertas y ascensores">Todos los pasajes</h2>
                </div>
                <div class="ogn-head__right">
                    <button class="ogn-btn ogn-btn--primary" onclick="openEditor(null, null)">
                        <iconify-icon icon="lucide:plus"></iconify-icon>
                        <span>Nuevo pasaje</span>
                    </button>
                </div>
            </header>

            <div class="ogn-content">
                <section class="ogn-panel">
                    <header class="ogn-panel__head">
                        <div class="ogn-search">
                            <iconify-icon icon="lucide:search" class="ogn-search__icon"></iconify-icon>
                            <input class="ogn-search__input" id="searchInput" type="text"
                                placeholder="Buscar pasaje o punto" oninput="renderTeleports()">
                        </div>
                        <span class="tp-cab">
                            <span class="ogn-chip ogn-chip--neutral" id="results-count">0</span>
                        </span>
                    </header>

                    <div class="tp-caja">
                        <div class="ogn-grid tp-rejilla" id="passageGrid"></div>
                        <div class="ogn-empty" id="emptyState">
                            <iconify-icon class="ogn-empty__icon" icon="lucide:door-closed"
                                style="font-size:calc(3.4vh / var(--ogn-escala, 1))"></iconify-icon>
                            <p class="ogn-empty__text" id="emptyTitle">Todavía no hay pasajes</p>
                        </div>
                    </div>
                </section>
            </div>

            <!-- ══ Barra de datos ════════════════════════════════════ -->
            <div class="ogn-bar">
                <div class="ogn-bar__cell">
                    <span class="ogn-bar__label">Pasajes</span>
                    <span class="ogn-bar__value" id="bar-total">0</span>
                </div>
                <div class="ogn-bar__cell">
                    <span class="ogn-bar__label">Funcionando</span>
                    <span class="ogn-bar__value ogn-bar__value--live" id="bar-activos">0</span>
                </div>
                <div class="ogn-bar__cell">
                    <span class="ogn-bar__label">Apagados</span>
                    <span class="ogn-bar__value" id="bar-inactivos">0</span>
                </div>
                <div class="ogn-bar__cell">
                    <span class="ogn-bar__label">Puntos en total</span>
                    <span class="ogn-bar__value" id="bar-puntos">0</span>
                </div>
                <div class="ogn-bar__cell">
                    <span class="ogn-bar__label">Con contraseña</span>
                    <span class="ogn-bar__value" id="bar-clave">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- El nombre del filtro al pasar el ratón por el raíl. Va suelto en el
         <body> y no dentro del raíl, que lo recortaría. -->
    <span class="ogn-tip ogn-portal" id="rail-tip" hidden></span>

    <!-- ══ El editor de un punto ═════════════════════════════════════ -->
    <div class="ogn-modal ogn-portal" id="editorOverlay" hidden onmousedown="if (event.target === this) closeEditor()">
        <form class="ogn-modal__card" style="width: calc(58vh / var(--ogn-escala, 1))" onsubmit="event.preventDefault(); saveEditor()">
            <header class="ogn-modal__head">
                <span class="ogn-modal__titles">
                    <span class="ogn-modal__title" id="editorTitle">Nuevo pasaje</span>
                    <span class="ogn-modal__sub" id="editorKicker"></span>
                </span>
            </header>

            <div class="ogn-modal__body">
                <div class="tp-form">
                    <!-- Solo al crear un pasaje nuevo -->
                    <div class="tp-grupo" id="passageNameGroup" hidden>
                        <label class="ogn-field">
                            <span class="ogn-field__label">Cómo se llama el pasaje</span>
                            <input class="ogn-field__input" id="edit-passage-name" type="text"
                                placeholder="Comisaría de Mission Row">
                        </label>
                        <label class="ogn-field">
                            <span class="ogn-field__label">Contraseña</span>
                            <input class="ogn-field__input" id="edit-passage-password" type="text"
                                placeholder="Vacío para que no pida ninguna">
                        </label>
                    </div>

                    <label class="ogn-field" id="field-name">
                        <span class="ogn-field__label">Cómo se llama el punto</span>
                        <input class="ogn-field__input" id="edit-name" type="text" placeholder="Planta baja">
                    </label>

                    <label class="ogn-field">
                        <span class="ogn-field__label">Lo que se lee al acercarse</span>
                        <input class="ogn-field__input" id="edit-text" type="text" placeholder="[E] Usar el ascensor">
                    </label>

                    <div class="tp-grupo" id="field-coords">
                        <div class="tp-fila">
                            <label class="ogn-field">
                                <span class="ogn-field__label">Dónde está</span>
                                <input class="ogn-field__input" id="edit-coords" type="text" placeholder="Sin coger"
                                    readonly>
                            </label>
                            <button class="ogn-btn ogn-btn--quiet" type="button" onclick="getCoords()">
                                <iconify-icon icon="lucide:crosshair"></iconify-icon>
                                <span>Cogerla de donde estoy</span>
                            </button>
                        </div>
                        <span class="tp-pista" id="coords-hint">Se toma tu posición y hacia dónde miras.</span>
                    </div>

                    <div class="tp-reglas">
                        <label class="ogn-switch-row">
                            <span class="ogn-switch-row__txt">
                                <span class="ogn-switch-row__label">Pasar de dónde está el suelo</span>
                                <span class="ogn-switch-row__hint">Usa la altura tal cual, sin buscar el suelo más
                                    cercano.</span>
                            </span>
                            <button class="ogn-switch" type="button" id="edit-ignore" role="switch"
                                onclick="toggleOpt('edit-ignore')"><span class="ogn-switch__knob"></span></button>
                        </label>

                        <label class="ogn-switch-row">
                            <span class="ogn-switch-row__txt">
                                <span class="ogn-switch-row__label">Dejar pasar con coche</span>
                                <span class="ogn-switch-row__hint">Si vas conduciendo, el coche viaja contigo.</span>
                            </span>
                            <button class="ogn-switch" type="button" id="edit-vehicle" role="switch"
                                onclick="toggleOpt('edit-vehicle')"><span class="ogn-switch__knob"></span></button>
                        </label>
                    </div>
                </div>
            </div>

            <footer class="ogn-modal__foot">
                <button class="ogn-btn ogn-btn--ghost" type="button" onclick="closeEditor()">
                    <span>Dejarlo</span>
                </button>
                <button class="ogn-btn ogn-btn--solid" type="submit"><span>Guardar</span></button>
            </footer>
        </form>
    </div>

    <!-- ══ Preguntar antes de lo que no tiene vuelta ═════════════════ -->
    <div class="ogn-modal ogn-portal" id="confirmOverlay" hidden
        onmousedown="if (event.target === this) closeConfirm()">
        <form class="ogn-modal__card" style="width: calc(48vh / var(--ogn-escala, 1))" onsubmit="event.preventDefault(); confirmAction()">
            <header class="ogn-modal__head">
                <span class="ogn-modal__titles">
                    <span class="ogn-modal__title" id="confirmTitle">Confirmar</span>
                </span>
            </header>

            <div class="ogn-modal__body">
                <p class="ogn-prose" id="confirmMessage"></p>
                <div class="tp-form" id="confirmFields" hidden style="margin-top: calc(1.8vh / var(--ogn-escala, 1))">
                    <label class="ogn-field">
                        <span class="ogn-field__label">Cómo se llama el pasaje</span>
                        <input class="ogn-field__input" id="meta-name" type="text"
                            placeholder="Comisaría de Mission Row">
                    </label>
                    <label class="ogn-field">
                        <span class="ogn-field__label">Contraseña</span>
                        <input class="ogn-field__input" id="meta-password" type="text"
                            placeholder="Vacío para que no pida ninguna">
                    </label>
                </div>
            </div>

            <footer class="ogn-modal__foot">
                <button class="ogn-btn ogn-btn--ghost" type="button" onclick="closeConfirm()">
                    <span>Dejarlo</span>
                </button>
                <button class="ogn-btn ogn-btn--danger" type="submit" id="confirmBtn"><span>Borrar</span></button>
            </footer>
        </form>
    </div>

    <script>
        /*
            ORIGEN TELEPORTS

            Los pasajes que hay puestos por el mapa, cada uno con sus puntos.
            Un pasaje se enciende o se apaga entero, y los puntos se añaden,
            se editan y se borran de uno en uno.

            Pintado con el juego de piezas de la tablet. Ver la skill
            origen-tablet.
        */

        let passages = [];
        let currentFilter = 'all';
        let currentPassageIdx = null;
        let currentPointIdx = null;

        const FILTROS = [
            { id: 'all', icon: 'lucide:list', label: 'Todos los pasajes' },
            { id: 'active', icon: 'lucide:circle-check', label: 'Los que funcionan' },
            { id: 'inactive', icon: 'lucide:circle-slash', label: 'Los apagados' },
        ];

        const $ = (id) => document.getElementById(id);

        function post(url, data) {
            return fetch(`https://qbx_smallresources/${url}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data || {}),
            });
        }

        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            })[c]);
        }

        function passageName(passage, idx) {
            return passage.name || 'Pasaje ' + (idx + 1);
        }

        /* ── El raíl ───────────────────────────────────────────────────────
           El nombre del filtro sale FUERA, con el `top` calculado del botón:
           dentro del raíl lo recortaría todo lo que hay por encima. */
        function renderRail() {
            const nav = $('railNav');
            nav.innerHTML = '';

            FILTROS.forEach((f) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = `ogn-rail__it${currentFilter === f.id ? ' is-on' : ''}`;
                b.innerHTML = `${currentFilter === f.id ? '<span class="ogn-rail__bar"></span>' : ''}<iconify-icon icon="${f.icon}" style="font-size:calc(1.7vh / var(--ogn-escala, 1))"></iconify-icon>`;

                b.addEventListener('click', () => {
                    currentFilter = f.id;
                    $('tituloSeccion').innerText = f.label;
                    renderRail();
                    renderTeleports();
                });
                b.addEventListener('mouseenter', () => {
                    const r = b.getBoundingClientRect();
                    const tip = $('rail-tip');
                    tip.innerText = f.label;
                    tip.style.top = `${r.top + r.height / 2}px`;
                    tip.hidden = false;
                });
                b.addEventListener('mouseleave', () => { $('rail-tip').hidden = true; });

                nav.appendChild(b);
            });
        }

        /* ── La rejilla ───────────────────────────────────────────────── */
        function renderTeleports() {
            const grid = $('passageGrid');
            const empty = $('emptyState');
            const busca = $('searchInput').value.trim().toLowerCase();

            const filtrados = passages.filter((p, idx) => {
                if (currentFilter === 'active' && !p.enabled) return false;
                if (currentFilter === 'inactive' && p.enabled) return false;
                if (!busca) return true;
                const paja = [passageName(p, idx)]
                    .concat((p.points || []).map((pt) => pt._name || ''))
                    .join(' ')
                    .toLowerCase();
                return paja.includes(busca);
            });

            const activos = passages.filter((p) => p.enabled).length;
            const puntos = passages.reduce((t, p) => t + (p.points || []).length, 0);
            const conClave = passages.filter((p) => p.password).length;

            $('bar-total').innerText = passages.length;
            $('bar-activos').innerText = activos;
            $('bar-inactivos').innerText = passages.length - activos;
            $('bar-puntos').innerText = puntos;
            $('bar-clave').innerText = conClave;

            $('results-count').innerText = filtrados.length === 1 ? '1 pasaje' : `${filtrados.length} pasajes`;

            const estado = $('railStatus');
            estado.classList.toggle('is-on', activos > 0);
            $('railState').innerText = activos > 0 ? `${activos} en marcha` : 'Sin pasajes';

            grid.innerHTML = '';

            if (!filtrados.length) {
                grid.hidden = true;
                empty.hidden = false;
                const filtrando = busca || currentFilter !== 'all';
                $('emptyTitle').innerText = filtrando
                    ? 'Nada que coincida con lo que buscas'
                    : 'Todavía no hay pasajes';
                return;
            }

            grid.hidden = false;
            empty.hidden = true;

            filtrados.forEach((passage) => {
                const idx = passages.indexOf(passage);
                const card = document.createElement('article');
                card.className = 'tp-pasaje' + (passage.enabled ? '' : ' tp-pasaje--off');

                const points = passage.points || [];
                let puntosHtml = '';

                if (points.length) {
                    points.forEach((point, ptIdx) => {
                        const c = point.coords || [];
                        const coords = c.length >= 3
                            ? `${(+c[0]).toFixed(0)}, ${(+c[1]).toFixed(0)}, ${(+c[2]).toFixed(0)}`
                            : '';
                        puntosHtml += `
                            <div class="tp-punto" onclick="openEditor(${idx}, ${ptIdx})">
                                <iconify-icon class="tp-punto__i" icon="lucide:map-pin"></iconify-icon>
                                <span class="tp-punto__n">${esc(point._name)}</span>
                                <span class="tp-punto__c">${coords}</span>
                                <button class="tp-punto__x" type="button"
                                    onclick="event.stopPropagation(); deletePoint(${idx}, ${ptIdx})">
                                    <iconify-icon icon="lucide:trash-2"></iconify-icon>
                                </button>
                            </div>`;
                    });
                } else {
                    puntosHtml = '<div class="tp-sinpuntos">Sin puntos</div>';
                }

                card.innerHTML = `
                    <div class="tp-pasaje__cab">
                        <button class="tp-pasaje__n" type="button" onclick="editPassageMeta(${idx})">
                            ${passage.password ? '<iconify-icon icon="lucide:lock"></iconify-icon>' : ''}
                            ${esc(passageName(passage, idx))}
                            <iconify-icon icon="lucide:pencil"></iconify-icon>
                        </button>
                        <span class="ogn-chip ogn-chip--neutral">${points.length}</span>
                        <button class="ogn-switch${passage.enabled ? ' ogn-switch--on' : ''}" type="button"
                            role="switch" aria-checked="${passage.enabled ? 'true' : 'false'}"
                            onclick="togglePassage(${idx})"><span class="ogn-switch__knob"></span></button>
                    </div>

                    <div class="tp-puntos">${puntosHtml}</div>

                    <div class="tp-pasaje__pie">
                        <button class="ogn-btn ogn-btn--quiet" type="button" onclick="openEditor(${idx}, null)">
                            <iconify-icon icon="lucide:plus"></iconify-icon>
                            <span>Añadir punto</span>
                        </button>
                        <button class="ogn-btn ogn-btn--danger" type="button" onclick="deletePassage(${idx})">
                            <iconify-icon icon="lucide:trash-2"></iconify-icon>
                            <span>Borrar</span>
                        </button>
                    </div>`;

                grid.appendChild(card);
            });
        }

        function togglePassage(pIdx) {
            post('togglePassage', { index: pIdx });
        }

        /* ── Los interruptores del editor ─────────────────────────────── */
        function toggleOpt(id) {
            const el = $(id);
            const puesto = !el.classList.contains('ogn-switch--on');
            el.classList.toggle('ogn-switch--on', puesto);
            el.setAttribute('aria-checked', puesto ? 'true' : 'false');
        }

        function setOpt(id, value) {
            const el = $(id);
            el.classList.toggle('ogn-switch--on', !!value);
            el.setAttribute('aria-checked', value ? 'true' : 'false');
        }

        function getOpt(id) {
            return $(id).classList.contains('ogn-switch--on');
        }

        /* ── El editor ────────────────────────────────────────────────── */
        function openEditor(pIdx, ptIdx) {
            currentPassageIdx = pIdx;
            currentPointIdx = ptIdx;

            const sub = $('editorKicker');
            const title = $('editorTitle');
            const nameGroup = $('passageNameGroup');

            clearInvalid();

            if (pIdx === null) {
                title.innerText = 'Nuevo pasaje';
                sub.innerText = '';
                nameGroup.hidden = false;
                resetForm();
            } else if (ptIdx === null) {
                title.innerText = 'Añadir un punto';
                sub.innerText = passageName(passages[pIdx], pIdx);
                nameGroup.hidden = true;
                resetForm();
            } else {
                title.innerText = 'Editar el punto';
                sub.innerText = passageName(passages[pIdx], pIdx);
                nameGroup.hidden = true;
                loadForm(passages[pIdx].points[ptIdx]);
            }

            $('editorOverlay').hidden = false;
            setTimeout(() => $(pIdx === null ? 'edit-passage-name' : 'edit-name').focus(), 60);
        }

        function closeEditor() { $('editorOverlay').hidden = true; }
        function isEditorOpen() { return !$('editorOverlay').hidden; }

        function clearInvalid() {
            $('field-name').classList.remove('tp-mal');
            $('field-coords').classList.remove('tp-mal');
            $('coords-hint').innerText = 'Se toma tu posición y hacia dónde miras.';
        }

        function resetForm() {
            $('edit-passage-name').value = '';
            $('edit-passage-password').value = '';
            $('edit-name').value = '';
            $('edit-text').value = '[E] Ascensor';
            $('edit-coords').value = '';
            $('edit-coords').dataset.coords = '';
            setOpt('edit-ignore', true);
            setOpt('edit-vehicle', false);
        }

        function loadForm(point) {
            $('edit-name').value = point._name || '';
            $('edit-text').value = point.drawText || '';
            const coordsInput = $('edit-coords');
            if (point.coords) {
                coordsInput.value = point.coords.map((c) => (+c).toFixed(2)).join(', ');
                coordsInput.dataset.coords = JSON.stringify(point.coords);
            } else {
                coordsInput.value = '';
                coordsInput.dataset.coords = '';
            }
            setOpt('edit-ignore', point.ignoreGround);
            setOpt('edit-vehicle', point.allowVehicle);
        }

        function getCoords() {
            post('getCurrentCoords').then((r) => r.json()).then((data) => {
                if (!data || !data.coords) return;
                const c = data.coords;
                $('edit-coords').value = c.map((v) => (+v).toFixed(2)).join(', ');
                $('edit-coords').dataset.coords = JSON.stringify(c);
                $('field-coords').classList.remove('tp-mal');
                $('coords-hint').innerText = 'Cogida de donde estás ahora mismo.';
            }).catch((err) => console.error('Error capturando coords:', err));
        }

        function saveEditor() {
            const passageTitle = $('edit-passage-name').value.trim();
            const passagePassword = $('edit-passage-password').value;
            const name = $('edit-name').value.trim();
            const drawText = $('edit-text').value;
            const coordsData = $('edit-coords').dataset.coords;

            clearInvalid();

            let ok = true;
            if (!name) {
                $('field-name').classList.add('tp-mal');
                ok = false;
            }
            if (!coordsData) {
                $('field-coords').classList.add('tp-mal');
                $('coords-hint').innerText = 'Coge las coordenadas antes de guardar.';
                ok = false;
            }
            if (!ok) return;

            const pointData = {
                _name: name,
                drawText: drawText,
                coords: JSON.parse(coordsData),
                ignoreGround: getOpt('edit-ignore'),
                allowVehicle: getOpt('edit-vehicle'),
            };

            const payload = {
                passageName: currentPassageIdx === null ? (passageTitle || 'Nuevo pasaje') : undefined,
                password: currentPassageIdx === null ? passagePassword : undefined,
                point: pointData,
            };

            // Se cierra sin esperar: el refresco llega del servidor.
            closeEditor();

            post('saveTeleport', {
                passageIndex: currentPassageIdx,
                pointIndex: currentPointIdx,
                data: payload,
            }).catch((err) => console.error('Error guardando teleport:', err));
        }

        /* ── Nombre y contraseña del pasaje ───────────────────────────── */
        function editPassageMeta(pIdx) {
            const passage = passages[pIdx] || {};
            showConfirm({
                title: 'Editar el pasaje',
                message: `Cambia cómo se llama <strong>${esc(passageName(passage, pIdx))}</strong> o la contraseña que pide.`,
                tone: 'ok',
                confirmText: 'Guardar',
                fields: { name: passage.name || '', password: passage.password || '' },
                onConfirm: () => {
                    const newName = $('meta-name').value.trim();
                    const newPassword = $('meta-password').value;
                    if (!newName) return;
                    post('updatePassageMetadata', { index: pIdx, name: newName, password: newPassword });
                },
            });
        }

        /* ── Preguntar ────────────────────────────────────────────────── */
        let confirmCallback = null;

        function showConfirm(opts) {
            const btn = $('confirmBtn');

            $('confirmTitle').innerText = opts.title;
            btn.querySelector('span').innerText = opts.confirmText || 'Borrar';

            const malo = (opts.tone || 'bad') === 'bad';
            btn.classList.toggle('ogn-btn--danger', malo);
            btn.classList.toggle('ogn-btn--solid', !malo);

            $('confirmMessage').innerHTML = opts.message || '';

            const campos = $('confirmFields');
            campos.hidden = !opts.fields;
            if (opts.fields) {
                $('meta-name').value = opts.fields.name;
                $('meta-password').value = opts.fields.password;
            }

            confirmCallback = opts.onConfirm || null;
            $('confirmOverlay').hidden = false;

            if (opts.fields) {
                setTimeout(() => {
                    const input = $('meta-name');
                    if (input) { input.focus(); input.select(); }
                }, 60);
            }
        }

        function closeConfirm() {
            $('confirmOverlay').hidden = true;
            confirmCallback = null;
        }

        function isConfirmOpen() { return !$('confirmOverlay').hidden; }

        function confirmAction() {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        }

        function deletePoint(pIdx, ptIdx) {
            const pointName = passages[pIdx]?.points?.[ptIdx]?._name || 'este punto';
            showConfirm({
                title: 'Borrar el punto',
                message: `Se borra <strong>${esc(pointName)}</strong>. No se puede deshacer.`,
                onConfirm: () => post('deletePoint', { pIdx: pIdx, ptIdx: ptIdx }),
            });
        }

        function deletePassage(index) {
            const passage = passages[index] || {};
            const count = passage.points?.length || 0;
            showConfirm({
                title: 'Borrar el pasaje',
                message: `Se borra <strong>${esc(passageName(passage, index))}</strong>${count ? ` con sus ${count} ${count === 1 ? 'punto' : 'puntos'}` : ''}. No se puede deshacer.`,
                onConfirm: () => post('deletePassage', { index: index }),
            });
        }

        function closeApp() { post('closeApp'); }

        /* ── Enlace con el cliente ────────────────────────────────────── */
        window.addEventListener('message', function (event) {
            const item = event.data;
            if (item.action === 'show') {
                $('app').style.display = 'block';
            } else if (item.action === 'hide') {
                $('app').style.display = 'none';
                closeEditor();
                closeConfirm();
            } else if (item.action === 'refresh') {
                passages = item.passages || [];
                renderTeleports();
            }
        });

        // Escape cierra lo de encima, y si no hay nada abierto, la pantalla.
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                if (isConfirmOpen()) closeConfirm();
                else if (isEditorOpen()) closeEditor();
                else closeApp();
            }
        });

        renderRail();
        window.onload = () => post('ready');
    </script>
</body>

</html>
