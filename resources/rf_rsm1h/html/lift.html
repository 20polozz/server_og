<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RF Elevator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
:root { --ui-scale:1; --led:#7fb8ff; --led-rgb:127,184,255; --amb:#f5c451; --ink:#f4f1ec; --mich:"Michroma",sans-serif; --sans:"Michroma",sans-serif; }
* { box-sizing:border-box; }
body { margin:0; height:100vh; width:100vw; font-family:var(--sans); color:var(--ink); background:transparent; overflow:hidden; }
#app { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .32s ease; }
/* after a floor is picked: the choice lit, the rest still there to press */
/* while it runs, the floors it is not going to sit back */
#app.sent .key { opacity:.55; }
#app.sent .key.going { opacity:1; }
#app.open { opacity:1; pointer-events:auto; }
#app.veh { --led:#7fb8ff; --led-rgb:127,184,255; }
#app.ppl { --led:#62d38a; --led-rgb:98,211,138; }
.card { position:relative; overflow:hidden; width:460px; max-width:92vw; border-radius:24px; padding:14px; display:flex; flex-direction:column; gap:14px; background:linear-gradient(160deg,#2a2826,#111); box-shadow:0 18px 44px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); user-select:none; transform:translateY(12px) scale(.97); opacity:0; transition:transform .4s cubic-bezier(.16,1,.3,1), opacity .3s ease; }
#app.open .card { transform:translateY(0) scale(var(--ui-scale)); opacity:1; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.top { display:flex; justify-content:space-between; align-items:center; padding:2px 6px 0; }
.top img { height:20px; width:auto; opacity:.9; }
.badge { display:flex; align-items:center; gap:8px; font-family:var(--mich); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:rgba(244,241,236,.4); }
.badge i { width:5px; height:5px; border-radius:3px; background:#62d38a; box-shadow:0 0 6px #62d38a; }
.led { position:relative; overflow:hidden; border-radius:16px; background:linear-gradient(180deg,#0a0a0a,#161514); box-shadow:0 3px 12px rgba(0,0,0,.95) inset, 0 0 0 1px rgba(255,85,96,.22), 0 0 18px rgba(255,85,96,.07) inset; display:flex; align-items:center; padding:22px 20px; transition:box-shadow .3s; }
.led.dest { box-shadow:0 3px 12px rgba(0,0,0,.95) inset, 0 0 0 1px rgba(255,85,96,.55), 0 0 26px rgba(255,85,96,.18) inset; }
.read { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
.status { display:block; width:100%; font-family:var(--mich); font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:rgba(244,241,236,.66); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.led.dest .status { color:#ff5560; }
.floor { display:block; width:100%; font-family:var(--mich); font-size:14px; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rule { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; }
.rule i { flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(255,85,96,.35)); }
.rule i + .digit + i { background:linear-gradient(90deg,rgba(255,85,96,.35),transparent); }
.digit { flex:none; font-family:var(--mich); font-size:72px; line-height:.9; color:var(--led); text-shadow:0 0 20px var(--led); transition:color .3s, text-shadow .3s; }
.led.dest .digit { color:#ff5560; text-shadow:0 0 20px #ff5560; }
.name-off, .arrow-off { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
.keys { display:flex; flex-direction:column; gap:8px; }
.key { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; width:100%; min-height:58px; border:0; border-radius:14px; padding:0 16px; cursor:pointer; font:inherit; color:inherit; background:radial-gradient(circle at 50% 30%,#44413c,#2a2826 55%,#1e1d1b); box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 -3px 0 rgba(0,0,0,.5) inset, 0 4px 8px rgba(0,0,0,.4); transition:color .16s, transform .12s; }
.key:active { transform:translateY(2px) scale(.99); }
.ktext { display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:0; }
.face { display:block; font-family:var(--mich); font-size:14px; letter-spacing:.1em; color:rgba(244,241,236,.72); }
.lbl { display:block; width:100%; text-align:center; font-family:var(--mich); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(244,241,236,.72); }
.tick { position:absolute; left:12px; right:12px; bottom:0; height:2px; border-radius:2px; background:rgba(244,241,236,.1); }
.key.cur { background:linear-gradient(180deg,#141312,#242220); box-shadow:0 3px 8px rgba(0,0,0,.7) inset, 0 0 18px rgba(255,255,255,.12) inset, 0 0 0 1px var(--led); }
.key.cur .face { color:var(--led); text-shadow:0 0 12px var(--led); }
.key.cur .lbl { color:var(--ink); }
.key.cur .tick { background:var(--led); box-shadow:0 0 12px var(--led); }
/* where it is headed, while it runs: red, like the phone's elevator page */
.key.going { background:linear-gradient(180deg,#141312,#242220); box-shadow:0 3px 8px rgba(0,0,0,.7) inset, 0 0 18px rgba(255,85,96,.22) inset, 0 0 0 1px rgba(255,85,96,.6); }
.key.going .face { color:#ff5560; text-shadow:0 0 12px #ff5560; }
.key.going .lbl { color:var(--ink); }
.key.going .tick { background:#ff5560; box-shadow:0 0 12px #ff5560; }
/* the keyboard cursor: enough to see, not enough to read as lit */
.key.pick { box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 -3px 0 rgba(0,0,0,.5) inset, 0 4px 8px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.18); }
.foot { display:flex; justify-content:space-between; align-items:center; padding:0 6px 2px; font-family:var(--mich); font-size:7.5px; letter-spacing:.14em; text-transform:uppercase; color:rgba(244,241,236,.3); }
.foot b { font-weight:400; color:rgba(244,241,236,.55); }

#hint { position:fixed; left:50%; bottom:28%; transform:translate(-50%,16px); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .35s cubic-bezier(.16,1,.3,1); z-index:5; }
#hint.show { opacity:1; transform:translate(-50%,0); }
#app.open ~ #hint { opacity:0 !important; }
.hint-btn { box-sizing:border-box; width:236px; display:grid; grid-template-columns:36px 18px 1fr; align-items:center; gap:0 12px; padding:10px 16px 10px 10px; border-radius:14px; background:linear-gradient(160deg,#2a2826,#111); box-shadow:0 12px 28px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); }
.hint-key { box-sizing:border-box; width:36px; height:36px; border-radius:10px; display:grid; place-items:center; line-height:1;  background:linear-gradient(180deg,#3d3b37,#1e1d1b); box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 -3px 0 rgba(0,0,0,.5) inset, 0 4px 8px rgba(0,0,0,.4); font-family:var(--mich); font-size:12px; color:var(--ink); transform:translateY(-.05em); }
/* Michroma's line box is centred on its ascent and descent rather than on the
   cap height, so a capital sits a fraction low in its square. The nudge is on
   the letter, not the square, and is in em so it holds at any size. */
.hint-key-l { display:block; font-style:normal; transform:translateY(-.035em); }
.hint-text { font-family:var(--mich); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:rgba(244,241,236,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hint-ico { width:18px; height:18px; flex:none; justify-self:center; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; color:rgba(244,241,236,.8); }
.hint-ico.is-red   { color:#ff5560; }
.hint-ico.is-green { color:#62d38a; }

/* Nothing in a panel is meant to be selected: dragging across a label should
   not leave a blue highlight behind. Text fields stay selectable so a pasted
   link can still be edited. */
* { -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
img, svg { -webkit-user-drag: none; user-drag: none; }
  /* ORIGEN: quitado el Michroma forzado en todo el body */
</style>
