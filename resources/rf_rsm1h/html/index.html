     (medido en 25 tamaños). Mismos ficheros que el <link> de arriba; tiene que ir DESPUES
     de el (la ultima cara declarada gana). Lo genera fuente2.py del repaso del 06/10. -->
<style data-ogn-cifras>@font-face{font-family:"Oxanium";font-style:normal;font-weight:800;font-display:swap;src:url(https://fonts.gstatic.com/s/oxanium/v21/RrQPboN_4yJ0JmiMUW7sIGjd1IA9G83JeUiFD3ULdw.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;ascent-override:85%;descent-override:15%;line-gap-override:25%}@font-face{font-family:"Oxanium";font-style:normal;font-weight:800;font-display:swap;src:url(https://fonts.gstatic.com/s/oxanium/v21/RrQPboN_4yJ0JmiMUW7sIGjd1IA9G83JeUiLD3U.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;ascent-override:85%;descent-override:15%;line-gap-override:25%}</style>

<!-- ORIGEN · vigilante del raton. NO EDITAR A MANO: este trozo es identico
         en todas las interfaces del servidor y lo reparte
         kit/repartir-foco.py. El lado de Lua es @origen_map/shared/foco.lua:
         mientras el recurso tiene el raton, pregunta cada 1,5 s si esta
         pagina enseña algo, y si dos veces seguidas no, suelta el raton.
         Ante la duda contesta que SI: soltar el raton de una pantalla que se
         ve es peor que tardar en soltarlo. -->
    <script>
      (function () {
        // El fetch del navegador, guardado antes de que la pagina cargue lo
        // suyo: alguna (origen_titlemenu) declara un `fetch` global propio.
        var enviar = window.fetch.bind(window)
        var TOPE = 6000
        var HUECO = /^(transparent|rgba\([^)]*,\s*0(\.0+)?\))$/
        var SIEMPRE = { IMG: 1, VIDEO: 1, CANVAS: 1, IFRAME: 1, INPUT: 1, TEXTAREA: 1, SELECT: 1, BUTTON: 1, svg: 1, SVG: 1 }
        var color = function (c) { return c && !HUECO.test(c) }
        var borde = function (cs) {
          return (parseFloat(cs.borderTopWidth) > 0 && color(cs.borderTopColor)) ||
            (parseFloat(cs.borderBottomWidth) > 0 && color(cs.borderBottomColor)) ||
            (parseFloat(cs.borderLeftWidth) > 0 && color(cs.borderLeftColor)) ||
            (parseFloat(cs.borderRightWidth) > 0 && color(cs.borderRightColor))
        }
        var capa = function (cs) {
          return color(cs.backgroundColor) || cs.backgroundImage !== 'none' ||
            cs.boxShadow !== 'none' || borde(cs)
        }
        var pseudo = function (el, cual) {
          var ps = getComputedStyle(el, cual)
          var c = ps.content
          if (!c || c === 'none' || c === 'normal') return false
          return capa(ps) || (c.length > 2 && color(ps.color))
        }
        var pinta = function (el, cs) {
          if (SIEMPRE[el.tagName]) return true
          if (capa(cs)) return true
          if (color(cs.color) && parseFloat(cs.fontSize) > 0) {
            for (var h = el.firstChild; h; h = h.nextSibling) {
              if (h.nodeType === 3 && h.nodeValue.trim()) return true
            }
          }
          return pseudo(el, '::before') || pseudo(el, '::after')
        }
        var hayAlgo = function () {
          if (!document.body) return true
          var W = window.innerWidth
          var H = window.innerHeight
          var paseo = document.createTreeWalker(document.body, 1, {
            acceptNode: function (el) {
              var cs = getComputedStyle(el)
              // Lo que no se ve no deja ver a sus hijos: se salta la rama.
              if (cs.display === 'none' || parseFloat(cs.opacity) < 0.02) return 2
              // Ni lo marcado como HUD fijo (sin raton): no es una pantalla
              // abierta, y si contara la red no soltaria nunca.
              if (el.hasAttribute('data-foco-ignora')) return 2
              return 1
            }
          })
          var n = 0
          var el
          while ((el = paseo.nextNode())) {
            if (++n > TOPE) return true
            var cs = getComputedStyle(el)
            if (cs.visibility !== 'visible') continue
            var r = el.getBoundingClientRect()
            if (r.width < 2 || r.height < 2) continue
            if (r.right <= 0 || r.bottom <= 0 || r.left >= W || r.top >= H) continue
            if (pinta(el, cs)) return true
          }
          return false
        }
        window.addEventListener('message', function (e) {
          var d = e.data
          if (!d || d.accion !== 'origen:foco:mira') return
          var visto = true
          // Una pagina con HUD fijo (siempre pinta algo) dice ella misma si
          // hay una pantalla CON RATON delante: window.__origenFocoVisto.
          try {
            visto = typeof window.__origenFocoVisto === 'function'
              ? window.__origenFocoVisto() !== false
              : hayAlgo()
          } catch (err) { visto = true }
          try {
            var yo = typeof GetParentResourceName === 'function' ? GetParentResourceName() : null
            if (!yo) return
            enviar('https://' + yo + '/origen:foco:veo', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=UTF-8' },
              body: JSON.stringify({ n: d.n, visto: visto })
            }).catch(function () {})
          } catch (err) {}
        })
        window.__origenFocoHayAlgo = hayAlgo
      })()
    </script>
    <!-- /ORIGEN · vigilante del raton -->
<script>
  /* Para el vigilante del raton (@origen_map/shared/foco.lua): que cuenta
     como pantalla CON RATON. Los tres iframes (movil, ascensor, camara) estan
     siempre montados a pantalla completa, y mirando el DOM entero esta pagina
     diria siempre «se ve» (27/09). */
  window.__origenFocoVisto = function () {
    var raiz = document.getElementById('root')
    if (raiz && !raiz.classList.contains('hidden')) return true
    var capas = ['phoneFrame', 'liftFrame']
    for (var k = 0; k < capas.length; k++) {
      var f = document.getElementById(capas[k])
      if (f && f.style.pointerEvents === 'auto') return true
    }
    try {
      var cam = document.getElementById('camFrame')
      var feed = cam && cam.contentDocument && cam.contentDocument.getElementById('feed')
      if (feed && feed.classList.contains('is-on')) return true
    } catch (e) { return true }
    return false
  }
</script>

            </nav>
