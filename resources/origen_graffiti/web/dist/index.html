          // recargarse): el nombre del recurso tambien va en la direccion.
          if (!yo) {
            var h = /^cfx-nui-(.+)$/.exec(location.hostname)
            if (h) yo = h[1]
          }
          if (!yo) return
          fetch('https://' + yo + '/origen:marca:dame', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=UTF-8' },
            body: '{}'
          })
            .then(function (r) { return r.json() })
            .then(function (d) {
              if (d && d.marca) activar(d.marca)
              else throw new Error('sin marca')
            })
            .catch(function () { if (++intentos < 6) setTimeout(preguntar, 1500) })
        }
        preguntar()
      })()
    </script>
